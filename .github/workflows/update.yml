name: Daten-Update

on:
  schedule:
    # Taeglicher Hauptlauf: 09:00 UTC (Training + Simulation + Report)
    - cron: "0 9 * * *"
    # Spieltags-Refreshs (~45-60 Min. vor den Kickoff-Fenstern, UTC):
    # Sonntag vor dem 1pm-ET-Fenster (19:00 dt.) - Sommer- und Winterzeit abgedeckt
    - cron: "30 15 * * 0"
    - cron: "15 17 * * 0"
    # Sonntag vor dem 4pm-ET-Fenster (22:00 dt.)
    - cron: "15 20 * * 0"
    # Abendspiele Do/So/Mo (Kickoff ~20:15 ET = Nacht dt.)
    - cron: "30 23 * * 0,1,4"
    - cron: "15 0 * * 1,2,5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gridiron-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install pandas scikit-learn

      - name: Daten neu berechnen
        run: python update_data.py

      - name: Aenderungen committen
        run: |
          git config user.name "gridiron-bot"
          git config user.email "actions@github.com"
          git add data/ REPORT.md
          if git diff --cached --quiet; then
            echo "Keine Aenderungen"
            exit 0
          fi
          git commit -m "Daten-Update $(date -u +%F-%H%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push-Versuch $i fehlgeschlagen, neuer Anlauf..."
            sleep $((i * 10))
          done
          echo "Push endgueltig fehlgeschlagen"
          exit 1
