name: Daten-Update

# Alle Zeiten UTC, durchgehend auf krumme Minuten. Zur vollen Stunde ist GitHubs
# Scheduler ueberlastet: gemessen an diesem Repo lag "0 9 * * *" im Median 5,1 h
# zurueck und nie unter 3,9 h, waehrend Laeufe auf :20/:30/:40 im Median 1,5 h
# brauchten. Die alten Spieltagszeiten lagen ausserdem NACH dem Lock-Fenster
# (2,5 h vor Anpfiff) - die Picks waren da schon eingefroren. Alle Laeufe sind
# deshalb nach vorne gezogen, mit Puffer fuer mehrere Stunden Verzug.
on:
  schedule:
    # Taeglicher Grundlauf (Training, Simulation, Report)
    - cron: "13 6 * * *"

    # --- Sonntag ---
    # vor dem Lock der 13:00-ET-Spiele (Anpfiff 17:00 UTC, Lock 14:30 UTC)
    - cron: "19 9 * * 0"
    # vor dem Lock der 16:05/16:25-ET-Spiele (Lock ca. 17:35 UTC)
    - cron: "19 12 * * 0"
    # vor dem Lock des Sonntagabendspiels (Anpfiff 00:20 UTC Mo, Lock 21:50 UTC)
    - cron: "19 16 * * 0"

    # --- Montag ---
    # Ergebnisse der Sonntagsspiele einsammeln
    - cron: "19 2 * * 1"
    # vor dem Lock des Montagabendspiels (Anpfiff 00:15 UTC Di, Lock 21:45 UTC)
    - cron: "19 15 * * 1"

    # --- Dienstag: Ergebnis des Montagsspiels, damit die neue Woche aufgeht ---
    - cron: "19 6 * * 2"

    # --- Donnerstag: vor dem Lock des Donnerstagsspiels (Lock 21:50 UTC) ---
    - cron: "19 15 * * 4"
    # --- Freitag: Ergebnis des Donnerstagsspiels ---
    - cron: "19 3 * * 5"

  # Kernstueck gegen Verzug: sobald die KI-Kontextanalyse fertig ist, werden die
  # Picks neu gerechnet. Damit stimmt die Reihenfolge - erst Kontext, dann
  # Prognose - unabhaengig davon, wann GitHub die Crons tatsaechlich startet.
  workflow_run:
    workflows: ["KI-Kontextanalyse"]
    types: [completed]

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gridiron-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install pandas scikit-learn

      - name: Daten neu berechnen
        run: python update_data.py

      - name: Aenderungen committen
        run: |
          git config user.name "gridiron-bot"
          git config user.email "actions@github.com"
          git add data/ REPORT.md
          if git diff --cached --quiet; then
            echo "Keine Aenderungen"
            exit 0
          fi
          git commit -m "Daten-Update $(date -u +%F-%H%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push-Versuch $i fehlgeschlagen, neuer Anlauf..."
            sleep $((i * 10))
          done
          echo "Push endgueltig fehlgeschlagen"
          exit 1
