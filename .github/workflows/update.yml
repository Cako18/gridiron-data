name: Daten-Update

on:
  schedule:
    # Taeglicher Hauptlauf (Training, Simulation, Report)
    - cron: "0 9 * * *"

    # --- Spieltagslaeufe: jeweils ca. 30-45 Min. vor den Anstosszeiten ---
    # Die Zeiten decken Sommer- und Winterzeit ab (ET = UTC-4 bzw. UTC-5).
    # Sonntag vor dem 13:00-ET-Fenster (19:00 dt. Zeit)
    - cron: "20 16 * * 0"
    - cron: "20 17 * * 0"
    # Sonntag vor dem 16:05/16:25-ET-Fenster (22:00 dt. Zeit)
    - cron: "30 19 * * 0"
    - cron: "30 20 * * 0"
    # Sonntagabendspiel 20:20 ET (02:20 dt. Zeit in der Nacht)
    - cron: "40 23 * * 0"
    - cron: "40 0 * * 1"
    # Montagabendspiel
    - cron: "40 23 * * 1"
    - cron: "40 0 * * 2"
    # Donnerstagabendspiel
    - cron: "40 23 * * 4"
    - cron: "40 0 * * 5"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gridiron-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install pandas scikit-learn

      - name: Daten neu berechnen
        run: python update_data.py

      - name: Aenderungen committen
        run: |
          git config user.name "gridiron-bot"
          git config user.email "actions@github.com"
          git add data/ REPORT.md
          if git diff --cached --quiet; then
            echo "Keine Aenderungen"
            exit 0
          fi
          git commit -m "Daten-Update $(date -u +%F-%H%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push-Versuch $i fehlgeschlagen, neuer Anlauf..."
            sleep $((i * 10))
          done
          echo "Push endgueltig fehlgeschlagen"
          exit 1
