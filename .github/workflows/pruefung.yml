name: Monatliche Selbstpruefung

# Prueft einmal im Monat, ob die Merkmalsauswahl des Modells noch stimmt.
# Aendert NICHTS am Modell - schreibt nur PRUEFUNG.md und data/pruefung.json.
# Monatlich und nicht oefter: wer jede Woche auf dieselben Daten schaut,
# findet irgendwann zwangslaeufig einen Zufallsbefund.
on:
  schedule:
    - cron: "41 4 2 * *"      # am 2. jedes Monats, 04:41 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten
        run: pip install pandas numpy scikit-learn

      - name: Pruefung rechnen
        run: python pruefung.py

      # Nur die beiden Ergebnisdateien. Der Lauf baut nebenbei die Daten neu;
      # die gehoeren dem naechtlichen Update und werden hier nicht eingecheckt.
      - name: Ergebnis einchecken
        if: always()
        run: |
          git config user.name "gridiron-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f PRUEFUNG.md data/pruefung.json || true
          git diff --cached --quiet || git commit -m "Selbstpruefung $(date -u +%Y-%m)"
          git push || true
