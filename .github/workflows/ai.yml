name: KI-Kontextanalyse

on:
  schedule:
    # Sonntags 15:45 UTC = 11:45 ET - kurz nach den Inactives der Fruehspiele
    # (die 90 Minuten vor dem 13:00-ET-Kickoff veroeffentlicht werden) und damit
    # nach dem offiziellen Freitags-Gamestatus (Out/Doubtful/Questionable).
    - cron: "45 15 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gridiron-data
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kontextanalyse ausfuehren
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ai_context.py

      - name: Aenderungen committen
        if: success()
        run: |
          git config user.name "gridiron-bot"
          git config user.email "actions@github.com"
          git add data/ai_context.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen"
            exit 0
          fi
          git commit -m "KI-Kontext $(date -u +%F-%H%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push-Versuch $i fehlgeschlagen, neuer Anlauf..."
            sleep $((i * 10))
          done
          echo "Push endgueltig fehlgeschlagen"
          exit 1
