name: KI-Kontextanalyse

# Alle Zeiten UTC. Bewusst auf krumme Minuten: zur vollen Stunde ist GitHubs
# Scheduler ueberlastet. Gemessen an diesem Repo (18 Laeufe, 13.-21.09.2026):
#   "0 9 * * *"        -> Median 5,1 h Verzug, nie unter 3,9 h
#   Minute :20/:30/:40 -> Median 1,5 h, bester Lauf 1 Minute
# Die Zeiten liegen deshalb weit vor dem Lock-Fenster (2,5 h vor Anpfiff),
# nicht knapp davor.
on:
  schedule:
    # Do 12:23 UTC - nur das Donnerstagsspiel (AI_MAX_DAYS=1), Lock Do 21:50 UTC
    - cron: "23 12 * * 4"
    # So 08:23 UTC - Hauptlauf fuer den Sonntag, Lock der Nachmittagsspiele 14:30 UTC
    - cron: "23 8 * * 0"
    # So 15:37 UTC - Nachmittagsspiele sind eingefroren, nur Abend-/Nachtspiel offen
    - cron: "37 15 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gridiron-data
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kontextanalyse ausfuehren
        id: analyse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Nur der Donnerstagslauf bekommt einen engen Horizont. Leer = ganze Woche.
          AI_MAX_DAYS: ${{ github.event.schedule == '23 12 * * 4' && '1' || '' }}
        run: python ai_context.py

      # Bewusst always(): ein Teilergebnis von heute ist mehr wert als ein
      # vollstaendiger Kontext von vor einer Woche. Der Job bleibt trotzdem rot,
      # wenn die Analyse gemeckert hat - die Warnung geht nicht verloren.
      - name: Aenderungen committen
        if: always()
        run: |
          git config user.name "gridiron-bot"
          git config user.email "actions@github.com"
          git add data/ai_context.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen"
            exit 0
          fi
          git commit -m "KI-Kontext $(date -u +%F-%H%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push-Versuch $i fehlgeschlagen, neuer Anlauf..."
            sleep $((i * 10))
          done
          exit 1
