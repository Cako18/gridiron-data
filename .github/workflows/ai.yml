name: KI-Kontextanalyse

on:
  schedule:
    # Sonntags vor dem ersten Anstossfenster (beide Zeitzonen-Varianten)
    - cron: "0 16 * * 0"
    - cron: "0 17 * * 0"
    # Sonntags nochmal vor dem Abendspiel - bis dahin kann sich viel aendern
    - cron: "20 23 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gridiron-data
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kontextanalyse ausfuehren
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ai_context.py

      - name: Aenderungen committen
        if: always()
        run: |
          git config user.name "gridiron-bot"
          git config user.email "actions@github.com"
          git add data/ai_context.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen"
            exit 0
          fi
          git commit -m "KI-Kontext $(date -u +%F-%H%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push-Versuch $i fehlgeschlagen, neuer Anlauf..."
            sleep $((i * 10))
          done
          exit 1
